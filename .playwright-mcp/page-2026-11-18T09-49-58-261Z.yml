      - generic [ref=e577]:
        - generic [ref=e579]:
          - heading "Het fundament Onder uw woongeluk" [level=2] [ref=e580]
          - generic [ref=e581]: Vloeren van Knulst
        - generic [ref=e586]:
          - paragraph [ref=e588]: "Een vloer kiest u niet alleen vanwege esthetiek of prijs. U kiest met het geruststellende vooruitzicht op jarenlang comfortabel wonen. Op basis van vertrouwen en het gevoel dat het klopt, vandaag én in de toekomst. De vloerspecialisten van Knulst begrijpen dat als geen ander. Daarom draait alles wat zij doen om één gemeenschappelijk doel: het creëren van een stevig fundament onder uw woongeluk."
          - paragraph [ref=e590]:
            - strong [ref=e591]: Zorgvuldig proces
            - text: Het fundament wordt niet alleen bepaald door de kwaliteit van de vloer, maar vooral door de wijze waarop deze tot stand komt. Vanaf het eerste moment nemen deskundige vloerenadviseurs u stap voor stap mee in een transparant proces. Ze luisteren naar uw wensen en vertalen ideeën naar een persoonlijk vloerenadvies dat esthetiek, comfort en vakmanschap samenbrengt. Dat geeft rust. Omdat u zeker weet dat er zorgvuldig is nagedacht over elk detail.
            - strong [ref=e592]: Ambachtelijk vakmanschap
            - text: De kwaliteit van een vloer komt pas echt tot uiting in de manier waarop deze wordt aangebracht en afgewerkt. De vloerspecialisten van Knulst werken dagelijks in het besef dat zij te gast zijn in uw woning. Met precisie en respect voor uw leefomgeving realiseren zij een hoogwaardige vloer die niet alleen mooi is, maar ook duurzaam. Een vloer waar u niet meer over na hoeft te denken, maar waarop u elke dag opnieuw woongeluk ervaart.
            - strong [ref=e593]: Zekerheid na oplevering
            - text: Zorgeloos wonen begint pas echt na oplevering van uw nieuwe vloer. Daarom blijft Knulst betrokken, met duidelijke afspraken, lange garanties en service die de standaard overstijgt. Mocht er ooit iets zijn, dan kunt u rekenen op dezelfde aandacht en zorg als op dag één. Omdat zekerheid bij Knulst geen belofte is, maar een vanzelfsprekendheid.
            - strong [ref=e594]: Alles onder één dak
            - text: "Of u nu kiest voor een houten vloer, een PVC vloer, een gietvloer, keramische tegels of een combinatie met vloerverwarming: bij Knulst vindt u alle expertise onder één dak. Dat betekent voor u: overzicht, samenhang en één aanspreekpunt dat het geheel bewaakt. Van oriëntatie tot realisatie en daarna. Zo ontstaat niet alleen een mooie vloer, maar een totaaloplossing die aansluit bij uw manier van wonen. Ervaar zelf wat wij bedoelen met het fundament onder uw woongeluk. Welkom in de wereld van hoogwaardige vloeren. Welkom bij Knulst."
          - link "Plan uw adviesgesprek" [ref=e596] [cursor=pointer]:
            - /url: /showrooms/
