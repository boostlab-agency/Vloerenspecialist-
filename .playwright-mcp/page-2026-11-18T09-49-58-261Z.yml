          - generic [ref=e218]:
            - generic [ref=e219]: Uitstekende informatie bij keuze van onze nieuwe vloer en nadat alles was gerealiseerd ook de after sales. Keuze gemaakt voor nieuwe plavuizen in vestiging Nunspeet. Daarna vlotte levering en perfecte plaatsing van deze grote plavuizen (90x90 cm) en ook het inkorten van deuren, plaatsen van plinten etc. Kortom wij waren en zijn zeer tevreden over Fa. Knulst.
            - generic [ref=e220]:
              - generic [ref=e221]: Dhr. B. Bos
              - generic [ref=e222]: "-"
              - generic [ref=e223]: Bemmel
          - generic [ref=e225]:
            - generic [ref=e226]: Wij hebben een gietvloer en een PVC vloer bij Knulst gekocht. Van begin tot einde (bezoek showroom tot leggen van de vloeren) werd je goed in het proces meegenomen en van informatie voorzien. De planning werd goed uitgevoerd en ook het leggen van de vloeren. Wij zijn super tevreden over het hele proces.
            - generic [ref=e227]:
              - generic [ref=e228]: Mevr. N. Schwebke
              - generic [ref=e229]: "-"
              - generic [ref=e230]: Houten
          - generic [ref=e232]:
            - generic [ref=e233]: Zeer goede informatie vooraf. Zeer goede en fijne verkoper, heel klantgericht. Goede begeleiding tijdens het hele proces van aankoop, tot leggen van de vloer tot nazorg als vloeronderhoud. Zeer mooie kwaliteit van de vloer. Zeer deskundig gelegd.
            - generic [ref=e234]:
              - generic [ref=e235]: Mevr. K, van den Berg
              - generic [ref=e236]: "-"
              - generic [ref=e237]: Epe
          - generic [ref=e239]:
            - generic [ref=e240]: Wij zijn enorm tevreden met onze nieuwe vloer! De communicatie is heel fijn en de service is uitmuntend. Bij iedereen die hier over de vloer ;-) geweest is, merk je echt de passie voor het vak. Wij zouden Knulst bij iedereen aanraden!
            - generic [ref=e241]:
              - generic [ref=e242]: Mevr. T. Timmerman
              - generic [ref=e243]: "-"
              - generic [ref=e244]: Huizen
          - generic [ref=e246]:
            - generic [ref=e247]: De communicatie verliep heel goed. Vooraf ruim de tijd genomen voor het nodige kijk- en denkwerk. Alle afspraken werden stipt nagekomen. Er werd goed met ons meegedacht en het leggen van de vloer werd vakkundig, snel en precies gedaan (met dank aan Ko). Het eindresultaat mag er dan ook wezen. We zijn er heel blij mee.
            - generic [ref=e248]:
              - generic [ref=e249]: Dhr. J. ter Welle
              - generic [ref=e250]: "-"
              - generic [ref=e251]: Ruurlo
          - generic [ref=e253]:
            - generic [ref=e254]: Eiken houten vloer. De afdeling planning heeft goed naar mij geluisterd en geprobeerd om de vloer zo snel mogelijk te leggen. De vloer is ook heel mooi gelegd en alle verschillende mensen hebben netjes en op tijd gewerkt
            - generic [ref=e255]:
              - generic [ref=e256]: Mevr. M. Kouwenhoven
              - generic [ref=e257]: "-"
              - generic [ref=e258]: Zutphen
          - generic [ref=e260]:
            - generic [ref=e261]: Wij zijn super tevreden over onze visgraat parketvloer! Het verkoopgesprek met Job was prima, hij heeft goed geluisterd naar onze wensen. Communicatie van Knulst naar ons was altijd tijdig en helder. De vloer is gelegd door Wally, wat een harde werker en vakman! En wij genieten dagelijks van onze prachtige nieuwe vloer.
            - generic [ref=e262]:
              - generic [ref=e263]: Dhr. P. de Jong
              - generic [ref=e264]: "-"
              - generic [ref=e265]: Amsterdam
          - generic [ref=e267]:
            - generic [ref=e268]: Heel goede informatie vooraf, de diverse mogelijkheden ter plekke kunnen bekijken en zo een goede keuze kunnen maken. Het resultaat is volledig zoals ik me voorgesteld had. Ook het leggen van de vloerverwarming vooraf was naar volle tevredenheid. Prettige mensen die het werk uitvoerden, zowel voor de vloerverwarming als het leggen van de houten vloer.
            - generic [ref=e269]:
              - generic [ref=e270]: Mevr. J. Koudijs
              - generic [ref=e271]: "-"
              - generic [ref=e272]: Soest
          - generic [ref=e274]:
            - generic [ref=e275]: Hier wordt SERVICE met hoofdletters geschreven!
            - generic [ref=e276]:
              - generic [ref=e277]: Dhr. T. Philipsen
              - generic [ref=e278]: "-"
              - generic [ref=e279]: Huissen
          - generic [ref=e281]:
            - generic [ref=e282]: "Vanaf het eerste contact alleen maar super! Heldere afspraken, goede communicatie, aardige professionele vrouwen en mannen. En wat rest: een hele mooie vloer"
            - generic [ref=e283]:
